<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VolTune — natural text to speech</title>
    <meta name="description" content="Turn text and dialogue into natural, human-sounding speech. Runs entirely in your browser: nothing is uploaded." />
    <meta name="theme-color" content="#DDE5F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070B17" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="VolTune" />
    <meta property="og:description" content="Natural text to speech and dialogue, running privately in your browser." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="app" id="app">
      <header class="top glass">
        <a class="brand" href="/" aria-label="VolTune home">
          <svg class="mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
            <path class="mark-v" d="M5 7 L16 24 L27 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
            <circle class="mark-dot" cx="16" cy="24" r="3.1" fill="var(--accent)" />
          </svg>
          <span class="wordmark">VolTune</span>
        </a>
        <div class="tabs" role="tablist" aria-label="Mode" id="tabs">
          <button role="tab" id="tab-speak" aria-selected="true" aria-controls="panel" data-mode="speak">Speak</button>
          <button role="tab" id="tab-dialogue" aria-selected="false" aria-controls="panel" data-mode="dialogue" tabindex="-1">Dialogue</button>
          <span class="tab-ink" aria-hidden="true"></span>
        </div>
        <button class="btn quiet lab-open" id="lab-open" type="button" aria-haspopup="dialog">Voices</button>
      </header>

      <div class="load" id="load" hidden aria-hidden="true"><span></span></div>

      <main class="main">
        <div class="string-wrap" aria-hidden="true">
          <canvas id="string"></canvas>
        </div>

        <section class="panel glass" id="panel" role="tabpanel" aria-labelledby="tab-speak">
          <div class="editor" id="editor">
            <label class="sr-only" for="text">Text to speak</label>
            <textarea id="text" class="script" spellcheck="true" rows="5" maxlength="250000" placeholder="Type or paste what you want to hear."></textarea>
            <div class="cast" id="cast" hidden></div>
            <div class="tips-wrap" id="tips" hidden></div>
          </div>
          <div class="stage" id="stage" hidden aria-live="off"></div>
        </section>

        <div class="meta">
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <div class="aside">
            <button class="link" id="edit" type="button" hidden>Edit text</button>
            <button class="link" id="tips-toggle" type="button" hidden aria-controls="tips" aria-expanded="false">Script tips</button>
            <p class="count" id="count"></p>
          </div>
        </div>

        <div class="controls glass" id="controls">
          <div class="field" id="voice-field">
            <label for="voice">Voice</label>
            <div class="select"><select id="voice"></select></div>
          </div>
          <div class="field">
            <label for="pace">Pace <output id="pace-out" for="pace">1.00×</output></label>
            <input id="pace" type="range" min="0.7" max="1.3" step="0.05" value="1" />
          </div>
          <div class="field" id="rhythm-field">
            <label for="rhythm">Rhythm</label>
            <div class="select">
              <select id="rhythm">
                <option value="0.7">Brisk</option>
                <option value="1">Natural</option>
                <option value="1.35">Relaxed</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <button class="btn quiet" id="save" type="button" disabled>Save audio</button>
            <button class="btn quiet icon" id="play" type="button" disabled aria-label="Play">
              <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path class="i-play" d="M6 4.2v11.6a.6.6 0 0 0 .92.5l9-5.8a.6.6 0 0 0 0-1l-9-5.8A.6.6 0 0 0 6 4.2Z" fill="currentColor"/><path class="i-pause" d="M5.5 4h3v12h-3zM11.5 4h3v12h-3z" fill="currentColor"/></svg>
            </button>
            <button class="btn primary" id="speak" type="button">Speak</button>
          </div>
        </div>
      </main>

      <footer class="foot">
        <p>Runs on your device. Your text is never uploaded.</p>
        <p>Voices by <a href="https://huggingface.co/hexgrad/Kokoro-82M" target="_blank" rel="noopener noreferrer">Kokoro</a>, Apache 2.0.</p>
      </footer>
    </div>

    <noscript><p class="nojs">VolTune needs JavaScript to generate speech in your browser.</p></noscript>
  </body>
</html>
