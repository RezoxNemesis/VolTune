name: Build standalone HDMI Connect APK
on:
  push:
    branches: [hdmi-connect-release]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename installer
        run: cp app/build/outputs/apk/debug/app-debug.apk HDMI-Connect-v1.0.0.apk
      - name: Publish standalone APK as a prerelease (not Actions artifact storage)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hdmi-connect-public-v1.0.0
          target_commitish: hdmi-connect-release
          name: HDMI Connect — Standalone Android 1.0.0
          body: |
            Brand-new, independently implemented HDMI detection, video playback and Wi-Fi browser receiver application.
            APK is development-signed and is not a Play Store release.
            Compatible external-display hardware is required for direct HDMI output. No app can add missing USB-C DisplayPort video capability.
          prerelease: true
          make_latest: false
          files: HDMI-Connect-v1.0.0.apk
