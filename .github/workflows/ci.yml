name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Bundle the Cloudflare Worker exactly as a deploy would, without deploying.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # End to end: download the int8 model, render a two-voice scene for animation, and check it by ear-less analysis.
      - name: Render and check a scene
        env:
          VOLTUNE_PRECISION: int8
          VOLTUNE_DATA: ${{ runner.temp }}/voltune
        run: |
          printf '@Kabir = Teen boy\n@Tara = Teen girl\nKABIR\n(nervous)\nIs this seat taken?\n\nTara (laughs): Only by my backpack. Sit down.\nTara (whispering): The driver has not blinked once.\n' > scene.txt
          node dist/cli.js scene scene.txt -o scene
          test "$(stat -c %s scene/scene.wav)" -gt 50000
          node -e '
            const r = require("./scene/report.json"), s = require("./scene/scene.json"), l = require("./scene/lipsync.json");
            const fail = (m) => { console.error(m); process.exit(1); };
            if (s.cast.Kabir !== "pre_teen_boy") fail("cast");
            if (!r.transcripts) fail("transcripts did not run");
            if (r.score < 60) fail("score " + r.score);
            const clear = r.lines.find((x) => /backpack/.test(x.text));
            if (!clear || clear.wordErrorRate > 0.5) fail("unclear speech: " + JSON.stringify(clear));
            const w = r.lines.find((x) => x.tags.includes("whisper")), n = r.lines.find((x) => /backpack/.test(x.text));
            if (!(w.loudnessDb < n.loudnessDb - 2)) fail("whisper not quieter");
            if (!l.tracks.Tara || !/[AEO]/.test(l.tracks.Tara.shapes)) fail("lip-sync");
            console.log("score", r.score);'
          node dist/cli.js analyze scene/scene.wav --timeline scene/scene.json --no-asr > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: server-sample
          path: server/scene
          retention-days: 7

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the connector image
        run: docker build -f server/Dockerfile -t voltune-server .
      - name: Start it and check the MCP endpoint
        run: |
          docker run -d --name vt -p 7860:7860 -e VOLTUNE_TOKEN=ci-token -e VOLTUNE_WARM=0 voltune-server
          for i in $(seq 30); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            localhost:7860/mcp/ci-token -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q perform_script
          docker logs vt
