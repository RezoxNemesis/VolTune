name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # End to end: download the int8 model, perform a two-voice script, check the WAV.
      - name: Render a scene
        env:
          VOLTUNE_PRECISION: int8
          VOLTUNE_DATA: ${{ runner.temp }}/voltune
        run: |
          printf '@Kabir = Teen boy\n@Tara = Teen girl\nKABIR\n(nervous)\nIs this seat taken?\n\nTara (laughs): Only by my backpack.\n' > scene.txt
          node dist/cli.js render scene.txt -o scene.wav --json scene.json
          test "$(stat -c %s scene.wav)" -gt 50000
          node -e 'const j=require("./scene.json"); if (j.timeline.length < 3 || j.cast.Kabir !== "pre_teen_boy") process.exit(1)'
      - uses: actions/upload-artifact@v4
        with:
          name: server-sample
          path: |
            server/scene.wav
            server/scene.json
          retention-days: 7

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the connector image
        run: docker build -f server/Dockerfile -t voltune-server .
      - name: Start it and check the MCP endpoint
        run: |
          docker run -d --name vt -p 7860:7860 -e VOLTUNE_TOKEN=ci-token -e VOLTUNE_WARM=0 voltune-server
          for i in $(seq 30); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            localhost:7860/mcp/ci-token -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q perform_script
          docker logs vt
